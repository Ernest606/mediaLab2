<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lab2 - VR Application</title>
    <meta name="description" content="VR application with interactive controls.">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="js/aframe-pointcloud-component.js"></script>
    <script src="https://rdub80.github.io/aframe-gui/js/aframe-gui.min.js"></script>
    <script>
      AFRAME.registerComponent('control-panel', {
        init: function () {
          var el = this.el;
          
          document.getElementById('rotateLeft').addEventListener('click', function () {
            el.object3D.rotation.y -= 0.1;
          });
          document.getElementById('rotateRight').addEventListener('click', function () {
            el.object3D.rotation.y += 0.1;
          });
          document.getElementById('moveUp').addEventListener('click', function () {
            el.object3D.position.y += 0.1;
          });
          document.getElementById('moveDown').addEventListener('click', function () {
            el.object3D.position.y -= 0.1;
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-plane color="#C2B280" rotation="-90 0 0" height="100" width="100"></a-plane>
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" intensity="2" position="2 4 4"></a-light>
      <a-sky color="#0D1B2A"></a-sky>
      
      <a-pointcloud 
        id="model" 
        control-panel
        scale="1 1 1" 
        position="0 1 0" 
        rotation="0 110 0" 
        src="url(snack.ply)" 
        size="0.05">
      </a-pointcloud>
    </a-scene>

    <div style="position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 5px;">
      <button id="rotateLeft">Rotate Left</button>
      <button id="rotateRight">Rotate Right</button>
      <button id="moveUp">Move Up</button>
      <button id="moveDown">Move Down</button>
      <button id="zoomIn">Zoom In</button>
      <button id="zoomOut">Zoom Out</button>
    </div>
  </body>
</html>
