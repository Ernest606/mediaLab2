<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lab2 - VR Application</title>
    <meta name="description" content="VR Application using A-Frame.">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.1/dist/aframe-particle-system-component.min.js"></script>
    <script>
        let PLYLoader;
        fetch("https://cdn.jsdelivr.net/npm/three/examples/js/loaders/PLYLoader.js")
            .then(response => response.text())
            .then(scriptText => {
                eval(scriptText); 
                PLYLoader = THREE.PLYLoader; 
            });
    </script>
    <script src="https://rdub80.github.io/aframe-gui/examples/all_components.js"></script>
    <script>
        AFRAME.registerComponent('ply-model', {
            schema: { type: 'string' },
            init: function () {
                let el = this.el;
                let loader = new PLYLoader();  

                loader.load(this.data, function (geometry) {
                    let material = new THREE.MeshStandardMaterial({ color: 0x5555ff, flatShading: true });
                    let mesh = new THREE.Mesh(geometry, material);
                    el.setObject3D('mesh', mesh);
                });
            }
        });
        
        AFRAME.registerComponent('rotate-model', {
            init: function () {
                this.el.addEventListener('click', () => {
                    let model = document.querySelector('#model');
                    let rotation = model.getAttribute('rotation');
                    rotation.y += 45;
                    model.setAttribute('rotation', rotation);
                });
            }
        });
        
        AFRAME.registerComponent('move-model', {
            init: function () {
                this.el.addEventListener('click', () => {
                    let model = document.querySelector('#model');
                    let position = model.getAttribute('position');
                    position.x += 0.5;
                    model.setAttribute('position', position);
                });
            }
        });
        
        AFRAME.registerComponent('zoom-model', {
            init: function () {
                this.el.addEventListener('click', () => {
                    let model = document.querySelector('#model');
                    let scale = model.getAttribute('scale');
                    scale.x += 0.1;
                    scale.y += 0.1;
                    scale.z += 0.1;
                    model.setAttribute('scale', scale);
                });
            }
        });
    </script>
</head>
<body>
    <a-scene>
        <a-assets>
            <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
            <img id="skyTexture" src="https://cdn.aframe.io/a-painter/images/sky.jpg" crossorigin="anonymous">
        </a-assets>

        <a-plane src="#groundTexture" rotation="-90 0 0" height="100" width="100"></a-plane>
        <a-light type="ambient" color="#445451"></a-light>
        <a-light type="point" intensity="2" position="2 4 4"></a-light>
        <a-sky src="#skyTexture"></a-sky>

        <a-entity id="model" 
                  position="0 1 -3" 
                  scale="0.01 0.01 0.01"
                  ply-model="sculpt.ply"
                  material="color: blue">
        </a-entity>

        <a-entity id="control-panel" position="0 1.6 -2">
            <a-gui-button width="1" height="0.5" value="Rotate" position="-1 0 0" rotate-model></a-gui-button>
            <a-gui-button width="1" height="0.5" value="Move" position="0 0 0" move-model></a-gui-button>
            <a-gui-button width="1" height="0.5" value="Zoom" position="1 0 0" zoom-model></a-gui-button>
        </a-entity>
    </a-scene>
</body>
</html>
